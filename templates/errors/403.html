{% extends "base.html" %}

{% block title %}Access Denied (403) - {{ school_settings.school_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 text-center">
    <div class="card-custom p-5 shadow">
      <div class="text-danger mb-3">
        <i class="fa-solid fa-shield-halved display-1"></i>
      </div>
      <h2 class="fw-bold text-dark">403 - Access Forbidden</h2>
      <p class="text-muted mb-4">
        You do not have authorized role permissions to access this administrative portal or document.
      </p>
      <div>
        <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4">
          <i class="fa-solid fa-house me-1"></i> Return to Portal Home
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
